services:
  app1:
    build: ./app1
    ports:
      - "8081:80"
    depends_on:
      - redis
  app2:
    build: ./app2
    ports:
      - "8082:80"
    depends_on:
      - redis
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data: